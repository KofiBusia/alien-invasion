name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-11-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            lld

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v5-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v5-

      - name: Restore keystore
        run: |
          echo "" | base64 -d > release.keystore
          keytool -importkeystore \
            -srckeystore release.keystore -srcstoretype PKCS12 \
            -destkeystore release.jks -deststoretype JKS \
            -srcstorepass 'AlienInvasion2024!' \
            -deststorepass 'AlienInvasion2024!' \
            -srcalias alieninvasion -destalias alieninvasion \
            -noprompt

      - name: Build APK
        run: yes | buildozer android release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlienInvasion-release
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 90

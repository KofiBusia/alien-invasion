name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            lld

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v5-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v5-

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype JKS \
            -alias alieninvasion \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 'AlienInvasion2024!' \
            -keypass 'AlienInvasion2024!' \
            -dname 'CN=Alien Invasion, OU=Games, O=Manuel, L=Unknown, ST=Unknown, C=US'
          echo "=== KEYSTORE FINGERPRINT ==="
          keytool -list -v -keystore release.jks -storepass 'AlienInvasion2024!' | grep -A2 "Certificate fingerprint"

      - name: Build APK
        run: yes | buildozer android release

      - name: Sign AAB
        run: |
          AAB=$(ls bin/*.aab)
          echo "Signing: $AAB"
          jarsigner -verbose \
            -keystore release.jks \
            -storetype JKS \
            -storepass 'AlienInvasion2024!' \
            -keypass 'AlienInvasion2024!' \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" alieninvasion
          jarsigner -verify -verbose "$AAB" | tail -5
          echo "Signing complete"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlienInvasion-release
          path: bin/*.aab
          if-no-files-found: error
          retention-days: 90

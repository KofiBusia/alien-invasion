name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # lets you trigger it manually from GitHub

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Check out the code
      - uses: actions/checkout@v4

      # 2. Use Python 3.11 (Buildozer / python-for-android requirement)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install system packages required by Buildozer / NDK
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      # 4. Install Buildozer and Cython
      - name: Install Buildozer
        run: pip install buildozer cython

      # 5. Cache the large NDK / SDK downloads so re-runs are fast
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      # 6. Build the debug APK
      - name: Build APK
        run: buildozer android debug
        env:
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b

      # 7. Upload the APK as a downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlienInvasion-debug-apk
          path: bin/*.apk
          retention-days: 30

      # (Optional) also upload a release-signed APK
      # You would need to add signing secrets to your GitHub repo for this.
